# RSS AI Reader 配置示例

# HTTP 服务器配置
server:
  host: "127.0.0.1"
  port: 8080
  # Web 登录密码（留空则不启用登录校验）
  password: ""
  reader_password: ""           # 阅读密码：访客只读（仅浏览），留空不启用
  log_level: "INFO"       # 日志级别: DEBUG, INFO, WARN, ERROR
  log_max_line_len: 500 # 单行最大长度，0 表示不限制

# 数据库配置
database:
  path: "./data/rss.db"

# AI 配置
ai:
  # LLM 配置（用于摘要、分类、广告识别等）
  llm:
    provider: "openai"
    base_url: "https://api.deepseek.com/v1"
    api_key: "your-api-key-here"
    model: "deepseek-chat"
    # 备用 LLM：主模型失败时自动切换（地址/Key 留空沿用主配置；model 留空不启用）
    fallback:
      base_url: ""
      api_key: ""
      model: ""
    timeout: "60s"
    retry_interval: "3s"  # 重试基础间隔（指数退避：3s、6s、12s...封顶60s）

  # Embedding 配置（用于向量化）
  embedding:
    provider: "openai"
    base_url: "https://api.openai.com/v1"
    api_key: "your-api-key-here"
    model: "text-embedding-3-small"
    timeout: "30s"

# RSS 订阅配置
feeds:
  default_interval: "30m"
  max_concurrent: 5
  timeout: "30s"
  fetch_user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"

# 定时任务配置
scheduler:
  morning_report_time: "08:00"
  evening_report_time: "20:00"

# 数据清理配置
cleanup:
  ad_retention_days: 7
  notification_retention_days: 14
  auto_cleanup_time: "03:00"

# 推送渠道配置
push:
  # 邮件推送
  email:
    enabled: false
    smtp_host: "smtp.example.com"
    smtp_port: 587
    username: ""
    password: ""
    from: ""
    to: ""

  # Gotify 推送
  gotify:
    enabled: false
    url: "https://gotify.example.com"
    app_token: ""
    priority: 5

  # QQ Bot 推送
  qqbot:
    enabled: false
    app_id: ""
    app_token: ""
    user_id: ""
    enable_markdown: true  # 是否启用 Markdown 格式（true: 发送完整 Markdown 含链接; false: 转为纯文本）

  # Webhook 推送
  webhook:
    enabled: false
    url: ""
    headers: {}

  # 钉钉机器人推送
  dingtalk:
    enabled: false
    webhook_url: ""    # 完整 webhook 地址，如 https://oapi.dingtalk.com/robot/send?access_token=xxx
    secret: ""         # 加签密钥（安全设置为"加签"时必填，其他模式留空）

# 话题聚合配置（话题页频道分类；修改后重启生效）
# topics:
#   categories:                   # 按序匹配首个命中，AI 细粒度分类含任一关键词（子串匹配）即归入该频道
#     - name: 教育
#       keywords: "教育,学校,考试,招生,高考,中考,考研,留学,校园,学术"
#     - name: 科技
#       keywords: "科技,技术,软件,硬件,互联网,编程,工程,科学"
#     # 省略整个 topics 节（或 categories 留空）= 使用内置默认规则

# 数据库自动备份（VACUUM INTO 快照存至库文件同目录 backups/ 下，超出上限自动删最旧）
data_backup:
  auto_enable: false
  interval: 24h          # 距最近一次备份超过该时长才触发（调度器每 5 分钟检查一次）
  max_files: 7           # 备份文件保留上限

# 事件匹配器配置
event_matcher:
  match_threshold: 0.65          # 综合匹配阈值 (0-1)，越大越严格
  vector_min_similarity: 0.45    # 向量相似度最低阈值 (0-1)，越大越严格

# 提示词覆盖（留空使用程序内置默认，可在设置页编辑；修改后立即生效）
prompts:
  analyze_system: ""
  translate_system: ""
  report_featured: ""        # 日报重点报道提示词（占位符 domain/topic_name/tags/materials）
  report_brief: ""           # 日报简讯提示词（占位符 topic_name/materials）
  report_topic_story: ""     # 话题报告故事提示词（素材由程序附加）
