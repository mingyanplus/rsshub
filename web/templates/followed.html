{{define "content"}}
<style>
/* 文章卡片悬停浮动效果 */
.article-card {
    position: relative;
    z-index: 1;
    break-inside: avoid;
}
.article-card:hover {
    z-index: 50;
}
.article-card .hover-expand {
    display: none;
    position: absolute;
    left: 0;
    right: 0;
    top: 0;
    background: white;
    border-radius: 2px;
    box-shadow: 0 4px 16px rgba(28, 27, 25, 0.12), 0 1px 3px rgba(28, 27, 25, 0.08);
    padding: 12px;
    z-index: 100;
    border: 1px solid #b7d5c4;
    border-left: 2px solid #1a6b3c;
}
.article-card:hover .hover-expand {
    display: block;
}
/* 已读文章弱化样式 */
.article-card.read {
    opacity: 0.55;
}
.article-card.read .card-content h2 {
    font-weight: 400;
    color: #78716c;
}
.article-card.read:hover {
    opacity: 0.85;
}
</style>
<div class="flex flex-col md:flex-row gap-4 md:h-[calc(100vh-8rem)]">
    <!-- 左侧：文章列表 -->
    <div class="w-full md:w-[420px] flex-shrink-0 flex flex-col">
        <!-- 规则标题 -->
        <div class="bg-white rounded-xl shadow-sm p-3 mb-3">
            <div class="flex items-center gap-2">
                <span class="text-lg">⭐</span>
                <h2 class="font-semibold text-gray-800" id="rule-name">{{.RuleName}}</h2>
                <a href="/rules" class="ml-auto text-sm text-blue-500 hover:underline">返回规则列表</a>
            </div>
        </div>

        <!-- 文章列表 -->
        <div class="flex-1 md:min-h-0 overflow-y-auto pr-2">
            <div id="articles-grid" class="columns-1 gap-3">
                <!-- 文章卡片将通过 JS 动态加载 -->
            </div>

            <!-- 加载更多指示器 -->
            <div id="load-more-trigger" class="py-4 text-center text-gray-400">
                <div class="inline-flex items-center gap-2 text-sm">
                    <div class="animate-spin rounded-full h-4 w-4 border-2 border-blue-500 border-t-transparent"></div>
                    <span>加载中...</span>
                </div>
            </div>

            <!-- 没有更多文章 -->
            <div id="no-more-articles" class="hidden py-4 text-center text-gray-400 text-sm">
                <span>没有更多文章了</span>
            </div>

            <!-- 空状态 -->
            <div id="empty-state" class="hidden py-12 text-center text-gray-500">
                <div class="text-4xl mb-3">📭</div>
                <p class="mb-2">暂无匹配的文章</p>
                <p class="text-sm text-gray-400">该规则的关键词暂未匹配到文章</p>
                <a href="/rules" class="mt-4 inline-block bg-blue-500 text-white px-4 py-2 rounded-lg hover:bg-blue-600 transition">
                    修改规则关键词
                </a>
            </div>
        </div>
    </div>

    <!-- 右侧：文章预览栏 -->
    <div class="flex-1 flex flex-col min-w-0">
        <div class="bg-white rounded-xl shadow-sm flex-1 md:overflow-hidden flex flex-col" id="article-preview">
            <!-- 默认空状态 -->
            <div id="preview-empty" class="flex-1 flex items-center justify-center text-gray-400">
                <div class="text-center">
                    <div class="text-5xl mb-4">📖</div>
                    <p>选择一篇文章查看详情</p>
                </div>
            </div>
            <!-- 文章内容区域 -->
            <div id="preview-content" class="hidden flex-1 flex flex-col md:overflow-hidden">
                <!-- 头部信息 -->
                <div class="p-6 border-b border-gray-100 flex-shrink-0">
                    <div class="flex items-center justify-between mb-3">
                        <div class="flex items-center gap-2">
                            <span id="preview-rule" class="text-sm bg-yellow-100 text-yellow-700 px-2 py-1 rounded">⭐ 规则</span>
                        </div>
                        <div class="flex items-center gap-2">
                            <a id="preview-link" href="#" target="_blank"
                               class="text-sm text-blue-500 underline hover:text-blue-700 flex items-center gap-1">
                                查看原文 ↗
                            </a>
                        </div>
                    </div>
                    <div class="flex items-center gap-2 mb-2">
                        <span id="preview-source" class="text-sm text-gray-500"></span>
                        <span id="preview-time" class="text-sm text-gray-400"></span>
                    </div>
                    <h1 id="preview-title" class="text-xl font-bold text-gray-900 mb-3"></h1>
                    <!-- 关键词 -->
                    <div id="preview-tags" class="hidden">
                        <div class="flex items-center gap-2 flex-wrap">
                            <span class="text-sm text-gray-500">关键词：</span>
                            <div id="preview-keywords" class="flex gap-1 flex-wrap"></div>
                        </div>
                    </div>
                </div>
                <!-- 文章正文 -->
                <div class="md:flex-1 md:overflow-y-auto p-6">
                    <div id="flw-translate-toggle-container" class="hidden mb-3">
                        <button id="flw-translate-toggle" onclick="toggleFlwTranslation()" class="text-sm bg-green-100 text-green-700 px-3 py-1 rounded hover:bg-green-200 transition cursor-pointer">
                            查看中文翻译
                        </button>
                    </div>
                    <div id="flw-fetch-original-container" class="hidden mb-3">
                        <button id="flw-fetch-original-btn" onclick="fetchFlwOriginalContent()" class="text-sm bg-blue-100 text-blue-700 px-3 py-1 rounded hover:bg-blue-200 transition cursor-pointer">
                            获取原文
                        </button>
                    </div>
                    <div id="preview-body" class="prose prose-sm max-w-none text-gray-700 leading-relaxed"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
// 状态管理
let currentOffset = 0;
let isLoading = false;
let hasMore = true;
let selectedArticleId = null;
const pageSize = 20;
const ruleFilter = "{{.SelectedRule}}";

// 加载文章
async function loadArticles(append = false) {
    if (isLoading || !hasMore) return;
    isLoading = true;

    const trigger = document.getElementById('load-more-trigger');
    const noMore = document.getElementById('no-more-articles');
    const empty = document.getElementById('empty-state');

    trigger.classList.remove('hidden');
    noMore.classList.add('hidden');
    empty.classList.add('hidden');

    try {
        let url = `/api/followed?offset=${currentOffset}&limit=${pageSize}`;
        if (ruleFilter) {
            url += `&rule=${ruleFilter}`;
        }
        const response = await fetch(url);
        const articles = await response.json();

        if (!append) {
            document.getElementById('articles-grid').innerHTML = '';
            currentOffset = 0;
        }

        if (articles.length === 0 && !append) {
            hasMore = false;
            trigger.classList.add('hidden');
            empty.classList.remove('hidden');
            return;
        }

        if (articles.length === 0) {
            hasMore = false;
            trigger.classList.add('hidden');
            noMore.classList.remove('hidden');
            return;
        }

        if (articles.length < pageSize) {
            hasMore = false;
            noMore.classList.remove('hidden');
            trigger.classList.add('hidden');
        }

        const grid = document.getElementById('articles-grid');
        articles.forEach(article => {
            const card = createArticleCard(article);
            grid.insertAdjacentHTML('beforeend', card);
        });

        currentOffset += articles.length;
    } catch (err) {
        console.error('加载文章失败:', err);
    } finally {
        isLoading = false;
        if (hasMore) {
            trigger.classList.remove('hidden');
        }
    }
}

// 创建文章卡片 HTML
function createArticleCard(article) {
    const time = article.published_at || '';
    // 优先使用 ai_summary，没有则使用 summary 并清理 HTML
    let summary = article.ai_summary || article.summary || '';
    // 如果 summary 包含 HTML 标签，简单清理
    if (summary && !article.ai_summary) {
        summary = summary.replace(/<[^>]*>/g, '').replace(/&nbsp;/g, ' ').replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&amp;/g, '&');
    }
    const shortSummary = summary.length > 100 ? summary.substring(0, 100) + '...' : summary;

    const readClass = article.is_read ? ' read' : '';
    const readBadge = article.is_read ? '<span class="text-xs text-gray-400 bg-gray-100 px-1.5 py-0.5 rounded">已读</span>' : '<span class="text-xs text-blue-500 bg-blue-50 px-1.5 py-0.5 rounded">未读</span>';

    return `
    <article class="article-card${readClass} group relative bg-white rounded-lg shadow-sm transition-all duration-200 cursor-pointer border border-transparent mb-3"
             data-article-id="${article.id}"
             onclick="selectArticle(${article.id}, this)">
        <div class="card-content p-3">
            <h2 class="text-sm font-semibold text-gray-900 mb-1.5 line-clamp-2">${escapeHtml(article.title)}</h2>
            <p class="text-gray-500 text-xs line-clamp-3 mb-2">${escapeHtml(shortSummary)}</p>
            <div class="flex items-center gap-2 text-xs text-gray-400">
                <span>📰 ${article.feed_name || ''}</span>
                <span>📅 ${time}</span>

            </div>
        </div>
        <div class="hover-expand">
            <h2 class="text-sm font-semibold text-gray-900 mb-1.5">${escapeHtml(article.title)}</h2>
            <p class="text-gray-500 text-xs mb-2">${escapeHtml(summary)}</p>
            <div class="flex items-center gap-2 text-xs text-gray-400">
                <span>📰 ${article.feed_name || ''}</span>
                <span>📅 ${time}</span>

            </div>
        </div>
    </article>`;
}

// HTML 转义
function escapeHtml(text) {
    if (!text) return '';
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

// 选中文章
function selectArticle(id, element) {
    document.querySelectorAll('#articles-grid article').forEach(el => {
        el.classList.remove('bg-blue-50');
    });
    element.classList.add('bg-blue-50');
    selectedArticleId = id;
    loadArticlePreview(id);
    markAsRead(id, element);
}

// 标记文章为已读
function markAsRead(id, element) {
    if (element.classList.contains('read')) return; // 已经是已读
    element.classList.add('read');
    element.classList.remove('bg-blue-50');
    element.classList.add('bg-blue-50');
    fetch(`/api/articles/${id}/read`, { method: 'POST' }).catch(() => {});
}

// 加载文章预览
function loadArticlePreview(id) {
    document.getElementById('preview-empty').classList.add('hidden');
    document.getElementById('preview-content').classList.remove('hidden');

    fetch(`/api/articles/${id}`)
        .then(res => res.json())
        .then(article => {
            document.getElementById('preview-title').textContent = article.title || '无标题';
            document.getElementById('preview-source').textContent = '📰 ' + (article.feed_title || '未知来源');
            document.getElementById('preview-time').textContent = article.published_at || '';
            document.getElementById('preview-link').href = article.link || '#';

            // 翻译切换
            const flwTranslateContainer = document.getElementById('flw-translate-toggle-container');
            const flwTranslateBtn = document.getElementById('flw-translate-toggle');
            if (article.translated_content) {
                flwTranslateContainer.classList.remove('hidden');
                flwTranslateBtn.textContent = '查看中文翻译';
                flwTranslateBtn.dataset.showingTranslation = 'false';
                window._flwOriginalBody = null;
            } else {
                flwTranslateContainer.classList.add('hidden');
            }

            // 获取原文按钮
            const flwFetchContainer = document.getElementById('flw-fetch-original-container');
            const flwFetchBtn = document.getElementById('flw-fetch-original-btn');
            if (article.link) {
                flwFetchContainer.classList.remove('hidden');
                flwFetchBtn.textContent = '获取原文';
                flwFetchBtn.disabled = false;
            } else {
                flwFetchContainer.classList.add('hidden');
            }

            document.getElementById('preview-rule').textContent = '⭐ ' + (article.matched_rule_name || '');

            let body = article.content || article.summary || '暂无内容';
            if (body.includes('<') && body.includes('>')) {
                document.getElementById('preview-body').innerHTML = body;
            } else {
                document.getElementById('preview-body').innerHTML = formatContent(body);
            }

            // 保存原始正文
            window._flwOriginalBody = document.getElementById('preview-body').innerHTML;
            window._flwTranslatedContent = article.translated_content || '';

            const tagsContainer = document.getElementById('preview-tags');
            const keywordsEl = document.getElementById('preview-keywords');
            if (article.keywords) {
                tagsContainer.classList.remove('hidden');
                keywordsEl.innerHTML = article.keywords.split(',').map(k => {
                    const keyword = k.trim();
                    return `<a href="/articles?tag=${encodeURIComponent(keyword)}" class="text-xs bg-gray-100 text-gray-600 px-2 py-1 rounded hover:bg-blue-100 hover:text-blue-700 transition">${keyword}</a>`;
                }).join('');
            } else {
                tagsContainer.classList.add('hidden');
            }
        })
        .catch(err => {
            console.error('加载文章详情失败:', err);
        });
}

// 格式化内容
function formatContent(content) {
    if (!content) return '';
    return content.split(/\n\n+/).map(p => `<p>${p}</p>`).join('');
}

function toggleFlwTranslation() {
    const btn = document.getElementById('flw-translate-toggle');
    const body = document.getElementById('preview-body');
    if (btn.dataset.showingTranslation === 'true') {
        body.innerHTML = window._flwOriginalBody;
        btn.textContent = '查看中文翻译';
        btn.dataset.showingTranslation = 'false';
    } else {
        body.innerHTML = formatContent(window._flwTranslatedContent);
        btn.textContent = '查看原文';
        btn.dataset.showingTranslation = 'true';
    }
}

// 获取原文
async function fetchFlwOriginalContent() {
    const btn = document.getElementById('flw-fetch-original-btn');
    btn.textContent = '获取中...';
    btn.disabled = true;
    try {
        const resp = await fetch(`/api/articles/${selectedArticleId}/fetch-original`, { method: 'POST' });
        const data = await resp.json();
        if (data.success) {
            document.getElementById('preview-body').innerHTML = data.content;
            window._flwOriginalBody = data.content;
            btn.textContent = '已获取原文';
        } else {
            alert('获取失败: ' + data.error);
            btn.textContent = '获取原文';
            btn.disabled = false;
        }
    } catch (e) {
        alert('请求失败: ' + e.message);
        btn.textContent = '获取原文';
        btn.disabled = false;
    }
}

// 无限滚动 - Intersection Observer
const scrollContainer = document.querySelector('.flex-1.overflow-y-auto');
const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
        if (entry.isIntersecting && hasMore && !isLoading) {
            loadArticles(true);
        }
    });
}, { root: scrollContainer, rootMargin: '100px' });

observer.observe(document.getElementById('load-more-trigger'));

// 初始加载
loadArticles(false);
</script>
{{end}}
