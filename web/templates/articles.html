{{define "content"}}
<style>
/* 已读文章弱化样式 */
.article-card.read {
    opacity: 0.55;
}
.article-card.read h2 {
    font-weight: 400;
    color: #78716c;
}
.article-card.read:hover {
    opacity: 0.85;
}
/* 选中卡片（与话题流同款品牌绿高亮） */
.article-card.selected-card {
    border-color: #1a6b3c;
    background: #f0f7f2;
}
/* 文章预览正文：加大行间距与段间距 */
#preview-body {
    line-height: 1.9;
}
#preview-body p {
    margin-top: 1.5em;
    margin-bottom: 1.5em;
}
/* 正文内嵌 HTML 的常规排版（覆盖来源站残缺样式，色板与全局报纸风一致） */
#preview-body img {
    max-width: 100%;
    height: auto;
    border-radius: 4px;
    margin: 0.5em 0;
}
#preview-body table {
    display: block;
    width: 100%;
    border-collapse: collapse;
    margin: 1.25em 0;
    font-size: 0.9em;
    overflow-x: auto; /* 宽表横向滚动，避免撑破布局 */
}
#preview-body th, #preview-body td {
    border: 1px solid #d6d3cd;
    padding: 6px 10px;
    text-align: left;
    vertical-align: top;
}
#preview-body th {
    background: #f4f3f1;
    font-weight: 600;
}
#preview-body pre {
    background: #f4f3f1;
    border: 1px solid #e8e6e2;
    border-radius: 6px;
    padding: 12px;
    margin: 1.25em 0;
    overflow-x: auto;
    font-size: 0.85em;
    line-height: 1.6;
}
#preview-body code {
    font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
}
#preview-body p > code, #preview-body li > code {
    background: #f4f3f1;
    border-radius: 4px;
    padding: 1px 5px;
    font-size: 0.9em;
}
#preview-body blockquote {
    border-left: 3px solid #b7d5c4;
    background: #f0f7f2;
    border-radius: 0 4px 4px 0;
    padding: 8px 14px;
    margin: 1.25em 0;
    color: #78716c;
}
#preview-body ul, #preview-body ol {
    padding-left: 1.6em;
    margin: 1.25em 0;
}
#preview-body ul { list-style: disc; }
#preview-body ol { list-style: decimal; }
#preview-body li { margin: 0.4em 0; }
#preview-body h1, #preview-body h2, #preview-body h3, #preview-body h4 {
    font-weight: 700;
    color: #1c1b19;
    margin: 1.5em 0 0.6em;
    line-height: 1.4;
}
#preview-body h1 { font-size: 1.25em; }
#preview-body h2 { font-size: 1.15em; }
#preview-body h3 { font-size: 1.05em; }
#preview-body a {
    color: #1a6b3c;
    text-decoration: underline;
}
#preview-body hr {
    border: none;
    border-top: 1px solid #e8e6e2;
    margin: 1.5em 0;
}
#preview-body strong { font-weight: 700; }
</style>
<!-- 与话题流同构的分栏：左列表（4）+ 右预览（6），lg 以下预览转底部弹窗 -->
<div class="grid grid-cols-1 lg:grid-cols-[2fr_3fr] gap-6">
    <!-- 左栏：筛选器 + 文章列表 -->
    <div class="min-w-0">
        <!-- 筛选器 -->
        <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-3 mb-3 flex gap-3 items-center flex-wrap">
            <input type="text"
                   id="search-input"
                   placeholder="搜索文章..."
                   class="px-3 py-1.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 flex-1 min-w-[120px] text-sm">

            <select id="filter-feed" class="px-3 py-1.5 border border-gray-300 rounded-lg text-sm">
                <option value="">所有订阅源</option>
                {{range .Feeds}}
                <option value="{{.ID}}">{{.Title}}</option>
                {{end}}
            </select>

            <select id="filter-category" class="px-3 py-1.5 border border-gray-300 rounded-lg text-sm">
                <option value="">所有分类</option>
                {{range .Categories}}
                <option value="{{.ID}}">{{.Name}}</option>
                {{end}}
            </select>

            <label class="flex items-center gap-1.5 cursor-pointer">
                <input type="checkbox" id="filter-hide-ads" checked class="w-3.5 h-3.5 text-blue-600 rounded">
                <span class="text-xs text-gray-600">隐藏广告</span>
            </label>

            <select id="filter-read-status" class="px-3 py-1.5 border border-gray-300 rounded-lg text-sm">
                <option value="">全部</option>
                <option value="unread">未读</option>
                <option value="read">已读</option>
            </select>

            <select id="sort-mode" class="px-3 py-1.5 border border-gray-300 rounded-lg text-sm" title="智能推荐按兴趣画像排序；拓展发现以邻接主题与盲区补全为主，扩大视野">
                <option value="recommend" selected>✨ 为你精选</option>
                <option value="discover">🧭 拓展发现</option>
                <option value="latest">🕒 最新</option>
            </select>

            <!-- 标签筛选显示 -->
            <div id="tag-filter-display" class="hidden flex items-center gap-1 bg-blue-100 text-blue-700 px-2 py-1 rounded-full text-sm">
                <span id="tag-filter-name"></span>
                <button onclick="clearTagFilter()" class="ml-1 hover:text-blue-900 font-bold">&times;</button>
            </div>
        </div>

        <!-- 文章列表（页面级滚动 + 无限加载） -->
        <div id="articles-scroll" class="pr-1">
            <div id="articles-grid" class="space-y-4">
                <!-- 文章卡片将通过 JS 动态加载 -->
            </div>

            <!-- 加载更多指示器 -->
            <div id="load-more-trigger" class="py-4 text-center text-gray-400">
                <div class="inline-flex items-center gap-2 text-sm">
                    <div class="animate-spin rounded-full h-4 w-4 border-2 border-blue-500 border-t-transparent"></div>
                    <span>加载中...</span>
                </div>
            </div>

            <!-- 没有更多文章 -->
            <div id="no-more-articles" class="hidden py-4 text-center text-gray-400 text-sm">
                <span>没有更多文章了</span>
            </div>

            <!-- 空状态 -->
            <div id="empty-state" class="hidden py-12 text-center text-gray-500">
                <div class="text-4xl mb-3">📭</div>
                <p>暂无文章</p>
            </div>
        </div>
    </div>

    <!-- 右栏：文章预览（桌面 sticky 面板；手机底部弹窗，同一 DOM 响应式切换） -->
    <div id="preview-col"
         class="hidden fixed inset-0 z-40 bg-black/50 items-end
                lg:static lg:z-auto lg:block lg:bg-transparent">
        <div id="article-preview"
             class="bg-white w-full max-h-[88vh] rounded-t-2xl shadow-xl overflow-y-auto
                    lg:max-h-none lg:rounded-xl lg:border lg:border-gray-100 lg:shadow-sm
                    lg:sticky lg:top-20 lg:h-[calc(100vh-6.5rem)]">
            <!-- 手机端弹窗头部（桌面隐藏） -->
            <div class="lg:hidden sticky top-0 z-10 bg-white border-b border-gray-100 flex items-center justify-between px-4 py-3">
                <h3 class="font-semibold text-gray-800">文章详情</h3>
                <button onclick="closePreviewModal()" aria-label="关闭" class="text-gray-400 hover:text-gray-600 p-1 -mr-1">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                </button>
            </div>
            <!-- 默认空状态 -->
            <div id="preview-empty" class="flex-1 flex items-center justify-center text-gray-400 py-24">
                <div class="text-center">
                    <div class="text-5xl mb-4">📖</div>
                    <p>选择一篇文章查看详情</p>
                </div>
            </div>
            <!-- 文章内容区域 -->
            <div id="preview-content" class="hidden">
                <!-- 头部信息 -->
                <div class="p-6 border-b border-gray-100">
                    <div class="flex items-center justify-between mb-3 gap-2 flex-wrap">
                        <div class="flex items-center gap-2 min-w-0">
                            <span id="preview-source" class="text-sm bg-blue-100 text-blue-700 px-2 py-1 rounded"></span>
                            <span id="preview-time" class="text-sm text-gray-400"></span>
                        </div>
                        <div class="flex items-center gap-2 flex-wrap">
                            <button id="favorite-btn" onclick="toggleFavorite()" title="收藏（推荐正反馈）"
                                    class="hidden text-sm bg-gray-100 text-gray-500 px-2 py-1 rounded hover:bg-yellow-100 hover:text-yellow-700 transition cursor-pointer">☆ 收藏</button>
                            <button id="not-interested-btn" onclick="markNotInterested()" title="不感兴趣（推荐将降低此类内容）"
                                    class="hidden text-sm bg-gray-100 text-gray-500 px-2 py-1 rounded hover:bg-red-100 hover:text-red-600 transition cursor-pointer">✕ 不感兴趣</button>
                            <a id="preview-link" href="#" target="_blank"
                               class="text-sm text-blue-500 underline hover:text-blue-700 flex items-center gap-1">
                                查看原文 ↗
                            </a>
                        </div>
                    </div>
                    <h1 id="preview-title" class="text-xl font-bold text-gray-900 mb-3"></h1>
                    <!-- AI 分析标签 -->
                    <div id="preview-tags" class="hidden">
                        <div class="flex items-center gap-2 flex-wrap">
                            <span class="text-sm text-gray-500">关键词：</span>
                            <div id="preview-keywords" class="flex gap-1 flex-wrap"></div>
                        </div>
                    </div>
                </div>
                <!-- 文章正文 -->
                <div id="preview-scroll" class="p-6">
                    <div id="translate-toggle-container" class="hidden mb-3">
                        <button id="translate-toggle" onclick="toggleTranslation()" class="text-sm bg-green-100 text-green-700 px-3 py-1 rounded hover:bg-green-200 transition cursor-pointer">
                            查看中文翻译
                        </button>
                    </div>
                    <div id="fetch-original-container" class="hidden mb-3">
                        <button id="fetch-original-btn" onclick="fetchOriginalContent()" class="text-sm bg-blue-100 text-blue-700 px-3 py-1 rounded hover:bg-blue-200 transition cursor-pointer">
                            获取原文
                        </button>
                    </div>
                    <div id="preview-body" class="prose prose-sm max-w-none text-gray-700 leading-relaxed"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
// 状态管理
let currentOffset = 0;
let isLoading = false;
let hasMore = true;
let selectedArticleId = null;
let recommendMode = true; // 默认「为你精选」：按兴趣画像排序（切回"最新"恢复时间序）
const pageSize = 20;
const isDesktop = () => window.matchMedia('(min-width: 1024px)').matches;

// ===== 手机端预览弹窗（与话题流同款底部抽屉） =====
function openPreviewModal() {
    const col = document.getElementById('preview-col');
    col.classList.remove('hidden');
    col.classList.add('flex');
    document.body.classList.add('overflow-hidden'); // 锁定背景滚动
    document.getElementById('article-preview').scrollTop = 0;
}
function closePreviewModal() {
    finishBehaviorTracking(); // 关闭即结束本次阅读
    const col = document.getElementById('preview-col');
    col.classList.add('hidden');
    col.classList.remove('flex');
    document.body.classList.remove('overflow-hidden');
}
// ESC / 点遮罩关闭（仅手机弹窗形态；桌面预览常驻不响应）
document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && !isDesktop()) closePreviewModal();
});
document.getElementById('preview-col').addEventListener('click', e => {
    if (e.target === e.currentTarget && !isDesktop()) closePreviewModal();
});

// 标记文章为已读
async function markArticleRead(id) {
    const card = document.querySelector(`[data-article-id="${id}"]`);
    if (card && !card.classList.contains('read')) {
        card.classList.add('read');
    }
    try {
        await fetch(`/api/articles/${id}/read`, { method: 'POST' });
    } catch (e) {
        console.error('标记已读失败:', e);
    }
}

// ========== 推荐系统 P1：阅读行为埋点（进度 + 停留时长） ==========
let behaviorArticleId = null;   // 当前正在阅读的文章
let behaviorOpenAt = 0;         // 打开时间戳
let behaviorMaxProgress = 0;    // 累计最大滚动进度（只增不减）

// 开始跟踪一篇文章的阅读行为
function startBehaviorTracking(id) {
    if (behaviorArticleId === id) return;
    finishBehaviorTracking();
    behaviorArticleId = id;
    behaviorOpenAt = Date.now();
    behaviorMaxProgress = 0;
}

// 计算当前滚动进度（预览面板自身滚动；内容不足一屏视为已读完，与话题口径一致）
function currentScrollProgress() {
    const el = document.getElementById('article-preview');
    if (!el) return 0;
    if (el.scrollHeight <= el.clientHeight + 4) return 1;
    return (el.scrollTop + el.clientHeight) / el.scrollHeight;
}

// 上报当前文章的阅读行为（后端按阈值判定 读完/秒退/中途退出）
function finishBehaviorTracking() {
    if (!behaviorArticleId) return;
    const id = behaviorArticleId;
    const dwellMs = Date.now() - behaviorOpenAt;
    const progress = Math.max(behaviorMaxProgress, currentScrollProgress());
    behaviorArticleId = null;
    fetch(`/api/articles/${id}/behavior`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ progress, dwell_ms: dwellMs }),
        keepalive: true,
    }).catch(e => console.error('上报阅读行为失败:', e));
}

// 滚动进度累计（预览面板滚动）
document.getElementById('article-preview').addEventListener('scroll', () => {
    if (!behaviorArticleId) return;
    const p = currentScrollProgress();
    if (p > behaviorMaxProgress) behaviorMaxProgress = p;
}, { passive: true });

// 离开页面时 sendBeacon 兜底上报
window.addEventListener('pagehide', () => {
    if (!behaviorArticleId) return;
    const payload = JSON.stringify({
        progress: Math.max(behaviorMaxProgress, currentScrollProgress()),
        dwell_ms: Date.now() - behaviorOpenAt,
    });
    navigator.sendBeacon(`/api/articles/${behaviorArticleId}/behavior`, new Blob([payload], { type: 'application/json' }));
    behaviorArticleId = null;
});

// ========== 曝光批量上报（攒 10 秒或满 100 条 flush，不进阅读请求路径） ==========
let exposureQueue = [];
let exposureTimer = null;

function queueExposure(articleId, position, channel) {
    // channel 为空表示非推荐流曝光（后端统计自动忽略）
    exposureQueue.push({ article_id: articleId, position: position, channel: channel || '' });
    if (exposureQueue.length >= 100) flushExposures(false);
    else if (!exposureTimer) exposureTimer = setTimeout(() => flushExposures(false), 10000);
}

function flushExposures(useBeacon) {
    clearTimeout(exposureTimer);
    exposureTimer = null;
    if (exposureQueue.length === 0) return;
    const items = exposureQueue;
    exposureQueue = [];
    const body = JSON.stringify(items);
    if (useBeacon && navigator.sendBeacon) {
        navigator.sendBeacon('/api/behavior/exposures', new Blob([body], { type: 'application/json' }));
        return;
    }
    fetch('/api/behavior/exposures', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: body,
        keepalive: true,
    }).catch(e => {
        console.error('曝光上报失败:', e);
        exposureQueue = items.concat(exposureQueue);
    });
}
window.addEventListener('pagehide', () => flushExposures(true));

// ========== 收藏 / 不感兴趣 ==========
async function toggleFavorite() {
    if (!selectedArticleId) return;
    try {
        const res = await fetch(`/api/articles/${selectedArticleId}/favorite`, { method: 'POST' });
        const data = await res.json();
        if (data.success) renderFavoriteBtn(data.is_favorite);
    } catch (e) {
        console.error('切换收藏失败:', e);
    }
}

function renderFavoriteBtn(favorite) {
    const btn = document.getElementById('favorite-btn');
    if (favorite) {
        btn.textContent = '★ 已收藏';
        btn.className = 'text-sm bg-yellow-100 text-yellow-700 px-2 py-1 rounded hover:bg-yellow-200 transition cursor-pointer';
    } else {
        btn.textContent = '☆ 收藏';
        btn.className = 'text-sm bg-gray-100 text-gray-500 px-2 py-1 rounded hover:bg-yellow-100 hover:text-yellow-700 transition cursor-pointer';
    }
}

async function markNotInterested() {
    if (!selectedArticleId) return;
    try {
        await fetch(`/api/articles/${selectedArticleId}/not-interested`, { method: 'POST' });
        // 从列表移除卡片，预览回到空状态
        const card = document.querySelector(`[data-article-id="${selectedArticleId}"]`);
        if (card) card.remove();
        document.getElementById('preview-content').classList.add('hidden');
        document.getElementById('preview-empty').classList.remove('hidden');
        selectedArticleId = null;
        if (!isDesktop()) closePreviewModal();
    } catch (e) {
        console.error('标记不感兴趣失败:', e);
    }
}

// 从 URL 获取 tag 参数
function getTagFromUrl() {
    const params = new URLSearchParams(window.location.search);
    return params.get('tag') || '';
}

// 获取当前筛选条件
function getFilterParams() {
    const tag = getTagFromUrl();
    return {
        feed_id: document.getElementById('filter-feed').value,
        category_id: document.getElementById('filter-category').value,
        hide_ads: document.getElementById('filter-hide-ads').checked ? 'on' : '',
        is_read: document.getElementById('filter-read-status').value === 'read' ? 'true' : document.getElementById('filter-read-status').value === 'unread' ? 'false' : '',
        q: document.getElementById('search-input').value,
        tag: tag
    };
}

// 构建查询字符串
function buildQueryString(params) {
    const parts = [];
    for (const [key, value] of Object.entries(params)) {
        if (value) parts.push(`${encodeURIComponent(key)}=${encodeURIComponent(value)}`);
    }
    return parts.join('&');
}

// 加载文章
async function loadArticles(append = false) {
    if (isLoading || !hasMore) return;
    isLoading = true;

    const trigger = document.getElementById('load-more-trigger');
    const noMore = document.getElementById('no-more-articles');
    const empty = document.getElementById('empty-state');

    trigger.classList.remove('hidden');
    noMore.classList.add('hidden');
    empty.classList.add('hidden');

    const params = getFilterParams();
    params.offset = currentOffset;
    params.limit = pageSize;

    const queryString = buildQueryString(params);

    try {
        let articles;
        if (recommendMode) {
            // 推荐流：按兴趣画像多因子打分排序，一次取全量（curated 精选 / discover 拓展发现）
            const mode = document.getElementById('sort-mode').value === 'discover' ? 'discover' : 'curated';
            const response = await fetch(`/api/recommendations?limit=60&mode=${mode}`);
            articles = await response.json();
            hasMore = false;
            trigger.classList.add('hidden');
        } else {
            const response = await fetch(`/api/articles?${queryString}`);
            articles = await response.json();
        }

        if (!append) {
            document.getElementById('articles-grid').innerHTML = '';
            currentOffset = 0;
        }

        if (articles.length === 0 && !append) {
            hasMore = false;
            trigger.classList.add('hidden');
            empty.classList.remove('hidden');
            return;
        }

        if (articles.length === 0) {
            hasMore = false;
            trigger.classList.add('hidden');
            noMore.classList.remove('hidden');
            return;
        }

        if (articles.length < pageSize) {
            hasMore = false;
            noMore.classList.remove('hidden');
            trigger.classList.add('hidden');
        }

        const grid = document.getElementById('articles-grid');
        articles.forEach((article, idx) => {
            const card = createArticleCard(article);
            grid.insertAdjacentHTML('beforeend', card);
            // channel 是召回通道（服务端赋予）：仅推荐流携带；普通列表留空，不混入通道统计
            queueExposure(article.id, currentOffset + idx, article.channel || '');
        });

        currentOffset += articles.length;
    } catch (err) {
        console.error('加载文章失败:', err);
    } finally {
        isLoading = false;
        // 只有在没有更多文章时才隐藏加载指示器
        if (!hasMore) {
            trigger.classList.add('hidden');
        }
    }
}

// 创建文章卡片 HTML（与话题流卡片同款样式）
function createArticleCard(article) {
    const adBadge = article.is_ad ? '<span class="text-xs bg-red-100 text-red-700 px-1.5 py-0.5 rounded">广告</span>' : '';
    const failBadge = article.keywords === '处理失败'
        ? `<button onclick="event.stopPropagation(); retryArticle(${article.id}, this)" class="text-xs bg-red-100 text-red-700 px-1.5 py-0.5 rounded hover:bg-red-200 transition disabled:opacity-50">⚠ 处理失败 · 重试</button>`
        : '';
    const summary = article.ai_summary || article.summary || '';
    const time = article.published_at || '';
    const readClass = article.is_read ? 'read' : '';
    const reasonBadge = article.reason
        ? `<span class="text-green-700 bg-green-50 border border-green-200 rounded px-1.5 py-0.5">✨ ${escapeHtml(article.reason)}</span>`
        : '';

    return `
    <article class="article-card ${readClass} bg-white rounded-xl shadow-sm border border-gray-100 p-4 cursor-pointer transition hover:border-gray-300"
             data-article-id="${article.id}"
             onclick="selectArticle(${article.id}, this)">
        <h2 class="text-[15px] font-semibold text-gray-900 leading-snug">${adBadge}${failBadge} ${escapeHtml(article.title)}</h2>
        <p class="text-sm text-gray-600 mt-2 leading-6 line-clamp-2">${escapeHtml(summary)}</p>
        <div class="flex items-center gap-2 text-xs text-gray-400 mt-2 flex-wrap">
            <span class="truncate max-w-[180px]">📰 ${escapeHtml(article.feed_title || '')}</span>
            <span class="tabular-nums">📅 ${time}</span>
            ${reasonBadge}
        </div>
    </article>`;
}

// 手动重新处理失败的文章
async function retryArticle(id, btn) {
    const old = btn.textContent;
    btn.disabled = true;
    btn.textContent = '⏳ 已提交，AI 分析中…';
    try {
        const res = await fetch(`/api/articles/${id}/retry`, { method: 'POST' });
        const data = await res.json();
        if (!data.success) throw new Error(data.message || '提交失败');
        btn.textContent = '✓ 已重新提交，稍后自动刷新';
        setTimeout(() => location.reload(), 3000);
    } catch (err) {
        alert('重新处理失败：' + err.message);
        btn.disabled = false;
        btn.textContent = old;
    }
}

// HTML 转义
function escapeHtml(text) {
    if (!text) return '';
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

// 选中文章（手机端以弹窗预览，桌面右栏预览）
function selectArticle(id, element) {
    // 移除之前的选中状态
    document.querySelectorAll('#articles-grid article').forEach(el => {
        el.classList.remove('selected-card');
    });

    // 添加选中状态（品牌绿边框 + 浅绿底，与话题流一致）
    element.classList.add('selected-card');

    selectedArticleId = id;
    if (!isDesktop()) openPreviewModal();
    loadArticlePreview(id);
}

// 加载文章预览
async function loadArticlePreview(id) {
    try {
        const response = await fetch(`/api/articles/${id}`);
        const article = await response.json();

        // 隐藏空状态，显示内容
        document.getElementById('preview-empty').classList.add('hidden');
        document.getElementById('preview-content').classList.remove('hidden');

        // 标记为已读（后端持久化），并开始跟踪本次阅读行为
        markArticleRead(id);
        startBehaviorTracking(id);
        document.getElementById('article-preview').scrollTop = 0;

        // 填充内容
        document.getElementById('preview-title').textContent = article.title || '无标题';
        document.getElementById('preview-source').textContent = article.feed_title || '未知来源';
        document.getElementById('preview-time').textContent = article.published_at || '';
        document.getElementById('preview-link').href = article.link || '#';

        // 收藏/不感兴趣按钮初始化
        document.getElementById('favorite-btn').classList.remove('hidden');
        document.getElementById('not-interested-btn').classList.remove('hidden');
        renderFavoriteBtn(article.is_favorite);

        // 翻译切换
        const translateContainer = document.getElementById('translate-toggle-container');
        const translateBtn = document.getElementById('translate-toggle');
        if (article.translated_content) {
            translateContainer.classList.remove('hidden');
            translateBtn.textContent = '查看中文翻译';
            translateBtn.dataset.showingTranslation = 'false';
            window._currentOriginalBody = null;
        } else {
            translateContainer.classList.add('hidden');
        }

        // 获取原文按钮
        const fetchContainer = document.getElementById('fetch-original-container');
        const fetchBtn = document.getElementById('fetch-original-btn');
        if (article.link) {
            fetchContainer.classList.remove('hidden');
            fetchBtn.textContent = '获取原文';
            fetchBtn.disabled = false;
        } else {
            fetchContainer.classList.add('hidden');
        }

        // 正文内容 - 优先使用 content，然后是 summary
        let body = article.content || article.summary || '暂无内容';
        // 如果是HTML内容，直接渲染；否则用formatContent处理
        if (body.includes('<') && body.includes('>')) {
            document.getElementById('preview-body').innerHTML = body;
        } else {
            document.getElementById('preview-body').innerHTML = formatContent(body);
        }

        // 保存原始正文
        window._currentOriginalBody = document.getElementById('preview-body').innerHTML;
        window._currentTranslatedContent = article.translated_content || '';

        // 关键词
        const tagsContainer = document.getElementById('preview-tags');
        const keywordsEl = document.getElementById('preview-keywords');
        if (article.keywords) {
            tagsContainer.classList.remove('hidden');
            keywordsEl.innerHTML = article.keywords.split(',').map(k => {
                const keyword = k.trim();
                return `<a href="/articles?tag=${encodeURIComponent(keyword)}" class="text-xs bg-gray-100 text-gray-600 px-2 py-1 rounded hover:bg-blue-100 hover:text-blue-700 transition">${keyword}</a>`;
            }).join('');
        } else {
            tagsContainer.classList.add('hidden');
        }
    } catch (err) {
        console.error('加载文章详情失败:', err);
    }
}

// 格式化内容
function formatContent(content) {
    if (!content) return '';
    return content.split(/\n\n+/).map(p => `<p>${p}</p>`).join('');
}

// 切换翻译
function toggleTranslation() {
    const btn = document.getElementById('translate-toggle');
    const body = document.getElementById('preview-body');
    if (btn.dataset.showingTranslation === 'true') {
        body.innerHTML = window._currentOriginalBody;
        btn.textContent = '查看中文翻译';
        btn.dataset.showingTranslation = 'false';
    } else {
        body.innerHTML = formatContent(window._currentTranslatedContent);
        btn.textContent = '查看原文';
        btn.dataset.showingTranslation = 'true';
    }
}

// 获取原文
async function fetchOriginalContent() {
    const btn = document.getElementById('fetch-original-btn');
    btn.textContent = '获取中...';
    btn.disabled = true;
    try {
        const resp = await fetch(`/api/articles/${selectedArticleId}/fetch-original`, { method: 'POST' });
        const data = await resp.json();
        if (data.success) {
            document.getElementById('preview-body').innerHTML = data.content;
            window._currentOriginalBody = data.content;
            btn.textContent = '已获取原文';
        } else {
            alert('获取失败: ' + data.error);
            btn.textContent = '获取原文';
            btn.disabled = false;
        }
    } catch (e) {
        alert('请求失败: ' + e.message);
        btn.textContent = '获取原文';
        btn.disabled = false;
    }
}

// 筛选条件变化时重新加载
['filter-feed', 'filter-category', 'filter-hide-ads', 'filter-read-status'].forEach(id => {
    document.getElementById(id).addEventListener('change', () => {
        currentOffset = 0;
        hasMore = true;
        loadArticles(false);
    });
});

// 排序模式切换（最新 / 为你精选 / 拓展发现）
document.getElementById('sort-mode').addEventListener('change', (e) => {
    recommendMode = e.target.value !== 'latest';
    currentOffset = 0;
    hasMore = true;
    loadArticles(false);
});

// 搜索框防抖
let searchTimeout;
document.getElementById('search-input').addEventListener('input', () => {
    clearTimeout(searchTimeout);
    searchTimeout = setTimeout(() => {
        currentOffset = 0;
        hasMore = true;
        loadArticles(false);
    }, 500);
});

// 无限滚动 - Intersection Observer（列表随页面滚动，root 用默认视口）
const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
        if (entry.isIntersecting && hasMore && !isLoading) {
            loadArticles(true);
        }
    });
}, { rootMargin: '600px' });

observer.observe(document.getElementById('load-more-trigger'));

// 初始化标签筛选
function initTagFilter() {
    const tag = getTagFromUrl();
    if (tag) {
        const tagDisplay = document.getElementById('tag-filter-display');
        const tagName = document.getElementById('tag-filter-name');
        tagName.textContent = tag;
        tagDisplay.classList.remove('hidden');
    }
}

// 清除标签筛选
function clearTagFilter() {
    const url = new URL(window.location.href);
    url.searchParams.delete('tag');
    window.location.href = url.toString();
}

// 初始化
initTagFilter();

// 所有图片不发送 Referer，避免来源站防盗链拦截
const previewBody = document.getElementById('preview-body');
function applyNoReferrer() {
    previewBody.querySelectorAll('img').forEach(img => {
        img.referrerPolicy = 'no-referrer';
    });
}
applyNoReferrer();
new MutationObserver(applyNoReferrer).observe(previewBody, { childList: true, subtree: true });

// 初始加载
loadArticles(false);
</script>
