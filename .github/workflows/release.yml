name: Release

# 推送 v* 标签：编译多平台二进制 + 构建推送 Docker 镜像（:版本号 + :latest）
# 推送 main / feat 分支：仅构建 Docker 滚动标签 :edge（不发 Release，服务器可随时 pull :edge 更新）
# 手动触发：Actions 页面选分支构建（镜像同样打 :edge）
on:
  push:
    tags:
      - 'v*'
    branches:
      - main
      - 'feat/**'
  workflow_dispatch:

permissions:
  contents: write      # 创建 GitHub Release 并上传二进制
  packages: write      # 推送镜像到 GHCR

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ── 多平台二进制编译 + Release（仅正式发版）─────────────
  binaries:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux,   goarch: amd64, ext: ""      }
          - { goos: linux,   goarch: arm64, ext: ""      }
          - { goos: windows, goarch: amd64, ext: ".exe"  }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          mkdir -p dist/rss-ai-${{ matrix.goos }}-${{ matrix.goarch }}
          go build -trimpath \
            -ldflags "-s -w -X main.version=${GITHUB_REF_NAME} -X main.gitCommit=${GITHUB_SHA} -X main.buildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o dist/rss-ai-${{ matrix.goos }}-${{ matrix.goarch }}/rss-ai${{ matrix.ext }} ./cmd/server
          # 二进制运行需要模板与示例配置，一并打包
          cp -r web config.example.yaml dist/rss-ai-${{ matrix.goos }}-${{ matrix.goarch }}/

      - name: Package (tar / zip)
        run: |
          cd dist
          if [ "${{ matrix.goos }}" = "windows" ]; then
            7z a rss-ai-${GITHUB_REF_NAME}-${{ matrix.goos }}-${{ matrix.goarch }}.zip rss-ai-${{ matrix.goos }}-${{ matrix.goarch }}
          else
            tar -czf rss-ai-${GITHUB_REF_NAME}-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz rss-ai-${{ matrix.goos }}-${{ matrix.goarch }}
          fi

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/rss-ai-${{ github.ref_name }}-*

  # ── Docker 镜像构建（amd64）→ GHCR ─────────────────────
  # tag 推送 → :版本号 + :latest；分支推送/手动触发 → :edge 滚动标签
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags & version
        id: meta
        run: |
          IMAGE="${REGISTRY}/${IMAGE_NAME}"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="$GITHUB_REF_NAME"
            TAGS="$IMAGE:$GITHUB_REF_NAME
          $IMAGE:latest"
          else
            VERSION="edge-${GITHUB_SHA::7}"
            TAGS="$IMAGE:edge"
          fi
          {
            echo "tags<<EOF"
            echo "$TAGS"
            echo "EOF"
            echo "version=$VERSION"
          } >> "$GITHUB_OUTPUT"

      - name: Build & Push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
